<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading Alto City Limits Dark…</title>
</head>
<body>
<p style="font-family:system-ui;padding:2rem">Loading Dark preview…</p>
<script>
(async()=>{
  try{
    const version='dark-targeted-1';
    const names=['chunk-00','chunk-01','chunk-02','chunk-03'];
    const parts=await Promise.all(names.map(async n=>(await (await fetch(n+'?v='+version)).text()).trim()));
    const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();
    const css='<link rel="stylesheet" href="campaign-dark.css?v='+version+'">';
    const nav='<nav id="alc-pages-switcher" aria-label="Display mode"><a href="../light/" title="Light">☀</a><a class="active" href="./" title="Dark" aria-current="true">☾</a><a href="../dark-ages/" title="Dark Ages">✥</a><a href="../terminal/" title="Terminal">&gt;_</a></nav>';
    html=html.replace('</head>',css+'</head>').replace(/<body([^>]*)>/i,'<body$1>'+nav);
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<pre style="padding:2rem;white-space:pre-wrap">Could not load Dark preview: '+String(e)+'</pre>';
  }
})();
</script>
</body>
</html>
