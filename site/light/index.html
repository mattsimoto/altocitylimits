<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Alto City Limits Light…</title></head><body><p style="font-family:system-ui;padding:2rem">Loading Light preview…</p><script>(async()=>{try{const b64=(await (await fetch('page.gz.b64')).text()).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="padding:2rem;white-space:pre-wrap">Could not load Light preview: '+String(e)+'</pre>'}})();</script></body></html>
