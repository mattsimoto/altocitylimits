<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Alto City Limits preview…</title></head><body><p style="font-family:system-ui;padding:2rem">Loading preview…</p><script>(async()=>{try{const names=['chunk-00','chunk-01'];const parts=await Promise.all(names.map(async n=>(await (await fetch(n)).text()).trim()));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="padding:2rem;white-space:pre-wrap">Could not load preview: '+String(e)+'</pre>'}})();</script></body></html>
