name: One-shot theme lab normalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-theme-lab.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message == 'Add one-shot theme lab normalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild static previews from locked sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, gzip, base64

          def show(commit, path):
              return subprocess.check_output(['git','show',f'{commit}:{path}']).decode('utf-8')

          def pack(html):
              return base64.b64encode(gzip.compress(html.encode('utf-8'), compresslevel=9)).decode('ascii')

          # LIGHT: recover the locked approved Editorial payload, then change only the mode control.
          base='6ba537c388dfec20b0b5cde21e63d2601ce7a15a'
          old=show(base,'site/light/page.gz.b64').strip()
          light=gzip.decompress(base64.b64decode(old)).decode('utf-8')
          light=light.replace('.mode{border:1px solid var(--ink);padding:8px 10px}', '.mode-icons{display:flex;gap:7px;align-items:center;margin-left:auto}.mode-icon{width:23px;height:23px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font:700 13px/1 var(--sans);border-bottom:2px solid transparent}.mode-icon:hover,.mode-icon:focus{color:var(--accent);outline:none}.mode-icon[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}')
          light=light.replace('<span>Editorial Mode Preview</span>', '<div class="mode-icons" aria-label="Display mode"><a class="mode-icon" href="./" title="Light" aria-label="Light mode" aria-current="true">☀</a><a class="mode-icon" href="../dark/" title="Dark" aria-label="Dark mode">☾</a><a class="mode-icon" href="../dark-ages/" title="Dark Ages" aria-label="Dark Ages mode">✥</a><a class="mode-icon" href="../terminal/" title="Terminal" aria-label="Terminal mode">&gt;_</a></div>')
          light=light.replace('<a class="mode" href="#">Themes</a>', '')
          light=light.replace('<a class="brand" href="#">Alto City Limits</a>', '<a class="brand" href="../" title="Theme Lab">Alto City Limits</a>')
          Path('site/light/page.gz.b64').write_text(pack(light))
          Path('site/light/index.html').write_text('''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Alto City Limits Light…</title></head><body><p style="font-family:system-ui;padding:2rem">Loading Light preview…</p><script>(async()=>{try{const b64=(await (await fetch('page.gz.b64')).text()).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="padding:2rem;white-space:pre-wrap">Could not load Light preview: '+String(e)+'</pre>'}})();</script></body></html>''')

          # DARK AGES: rebuild v4 deterministically from the richer v3 checkpoint.
          da=show('6298580555093656628faae0befd7241668b4ed1','site/dark-ages/index.html')
          da=da.replace('<section class="section alt"><div class="wrap"><div class="section-head"><div class="folio">Folio II', '<section class="section alt" id="analysis"><div class="wrap"><div class="section-head"><div class="folio">Folio II')
          da=da.replace('<section class="section alt"><div class="wrap"><div class="section-head"><div class="folio">Folio IV', '<section class="section alt" id="record"><div class="wrap"><div class="section-head"><div class="folio">Folio IV')
          da=da.replace('<section class="section alt"><div class="wrap"><div class="section-head"><div class="folio">Folio VI', '<section class="section alt" id="tools"><div class="wrap"><div class="section-head"><div class="folio">Folio VI')
          da=da.replace('<section class="section"><div class="wrap"><div class="section-head"><div class="folio">Folio VII', '<section class="section" id="projects"><div class="wrap"><div class="section-head"><div class="folio">Folio VII')
          extra='''\n/* Dark Ages v4: manuscript marginalia lives outside the reading column. */\n.section,.hero,.contact{position:relative}\n.margin-beast{position:absolute;z-index:1;width:104px;pointer-events:none;opacity:.74;mix-blend-mode:multiply;filter:saturate(.72) sepia(.08) contrast(1.02)}\n.margin-beast img{display:block;width:100%;max-height:150px;object-fit:contain;border:0}\n.margin-beast:after{content:attr(data-note);display:block;margin-top:4px;text-align:center;font-size:12px;line-height:1.05;font-style:italic;color:var(--muted);transform:rotate(-3deg)}\n.margin-left{left:max(8px,calc((100vw - var(--max))/2 - 126px));top:92px;transform:rotate(-2deg)}\n.margin-right{right:max(8px,calc((100vw - var(--max))/2 - 126px));top:104px;transform:rotate(2deg)}\n.margin-low{top:auto;bottom:64px}.margin-small{width:82px;opacity:.66}.margin-tiny{width:66px;opacity:.62}\n.manicule{position:absolute;z-index:1;font-family:Georgia,serif;font-size:42px;line-height:1;color:var(--red);opacity:.7;pointer-events:none}\n.manicule.left{left:max(12px,calc((100vw - var(--max))/2 - 82px));top:52%}.manicule.right{right:max(12px,calc((100vw - var(--max))/2 - 82px));top:46%;transform:scaleX(-1)}\n.bio p:first-child::first-letter,.support::first-letter{float:left;font-family:var(--display);font-size:3.15em;line-height:.74;padding:.08em .11em .04em .05em;margin:.08em .12em 0 0;color:#f4e4b8;background:var(--red);border:2px double var(--gold);text-shadow:0 1px 0 #512015}\n.section-head{position:relative}.section-head:after{content:"❦";position:absolute;right:2px;bottom:7px;font-size:24px;color:var(--red);opacity:.65}\n.ornament-rule{display:flex;align-items:center;justify-content:center;gap:13px;margin:34px auto 0;color:var(--red);font-size:17px;letter-spacing:.22em;opacity:.7}.ornament-rule:before,.ornament-rule:after{content:"";width:min(180px,18vw);border-top:1px solid var(--rule-dark)}\n@media(max-width:1450px){.margin-beast{width:78px;opacity:.38}.margin-left{left:8px}.margin-right{right:8px}.manicule{display:none}}\n@media(max-width:1120px){.margin-beast{display:none}.bio p:first-child::first-letter,.support::first-letter{font-size:2.7em}.section-head:after{font-size:19px}}\n@media(max-width:680px){.bio p:first-child::first-letter,.support::first-letter{font-size:2.25em;border-width:1px}.ornament-rule{margin-top:24px}}\n'''
          da=da.replace('@media(prefers-reduced-motion:reduce)',extra+'\n@media(prefers-reduced-motion:reduce)')
          LION='https://commons.wikimedia.org/wiki/Special:Redirect/file/RochesterBestiaryFolio005vLion.jpg'
          GRIFFIN='https://commons.wikimedia.org/wiki/Special:Redirect/file/RochesterBestiary%20detail%20Griffin.jpg'
          DRAGON='https://commons.wikimedia.org/wiki/Special:Redirect/file/AberdeenBestiaryFolio065vDragon.jpg'
          MAP='https://commons.wikimedia.org/wiki/Special:Redirect/file/Mappa%20Mundi%202%20from%20Bede%2C%20De%20natura%20rerum.jpg'
          FIRM='https://commons.wikimedia.org/wiki/Special:Redirect/file/Bodleian%20Libraries%2C%20The%20firmament%20and%20text.jpg'
          inserts={
            '<section class="hero">':f'<section class="hero"><aside class="margin-beast margin-left margin-small" data-note="nota bene"><img src="{GRIFFIN}" alt="" aria-hidden="true"></aside>',
            '<section class="section" id="capabilities">':f'<section class="section" id="capabilities"><aside class="margin-beast margin-right" data-note="a useful beast"><img src="{LION}" alt="" aria-hidden="true"></aside><span class="manicule left" aria-hidden="true">☞</span>',
            '<section class="section alt" id="analysis">':f'<section class="section alt" id="analysis"><aside class="margin-beast margin-left margin-low" data-note="here be complexity"><img src="{DRAGON}" alt="" aria-hidden="true"></aside>',
            '<section class="section" id="about">':f'<section class="section" id="about"><aside class="margin-beast margin-right margin-small" data-note="the chronicler"><img src="{FIRM}" alt="" aria-hidden="true"></aside>',
            '<section class="section alt" id="record">':'<section class="section alt" id="record"><span class="manicule right" aria-hidden="true">☞</span>',
            '<section class="section" id="work">':f'<section class="section" id="work"><aside class="margin-beast margin-left margin-small" data-note="works recorded"><img src="{MAP}" alt="" aria-hidden="true"></aside>',
            '<section class="section alt" id="tools">':f'<section class="section alt" id="tools"><aside class="margin-beast margin-right margin-tiny margin-low" data-note="implements"><img src="{GRIFFIN}" alt="" aria-hidden="true"></aside>',
            '<section class="section" id="projects">':f'<section class="section" id="projects"><aside class="margin-beast margin-left margin-tiny" data-note="side works"><img src="{DRAGON}" alt="" aria-hidden="true"></aside>',
            '<section class="section alt" id="notes">':f'<section class="section alt" id="notes"><aside class="margin-beast margin-right margin-small" data-note="from the margin"><img src="{LION}" alt="" aria-hidden="true"></aside>',
            '<section class="contact" id="contact">':'<section class="contact" id="contact"><span class="manicule left" aria-hidden="true">☞</span>'}
          for old,new in inserts.items(): da=da.replace(old,new,1)
          b=pack(da)
          parts=[b[i:i+7000] for i in range(0,len(b),7000)]
          for i,part in enumerate(parts): Path(f'site/dark-ages/chunk-{i:02d}').write_text(part)
          for stale in Path('site/dark-ages').glob('chunk-*'):
              try: n=int(stale.name.split('-')[1])
              except: continue
              if n>=len(parts): stale.unlink()
          names=','.join(repr(f'chunk-{i:02d}') for i in range(len(parts)))
          Path('site/dark-ages/index.html').write_text(f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Alto City Limits Dark Ages…</title></head><body><p style="font-family:system-ui;padding:2rem">Loading Dark Ages preview…</p><script>(async()=>{{try{{const names=[{names}];const parts=await Promise.all(names.map(async n=>(await (await fetch(n)).text()).trim()));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}}catch(e){{document.body.innerHTML='<pre style="padding:2rem;white-space:pre-wrap">Could not load Dark Ages preview: '+String(e)+'</pre>'}}}})();</script></body></html>''')

          # DARK / CAMPAIGN: inject only the tiny Pages mode utility into the static loader; compressed Campaign stays untouched.
          dark='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Alto City Limits preview…</title></head><body><p style="font-family:system-ui;padding:2rem">Loading preview…</p><script>(async()=>{try{const names=['chunk-00','chunk-01','chunk-02','chunk-03'];const parts=await Promise.all(names.map(async n=>(await (await fetch(n)).text()).trim()));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();const css=`<style>#alc-pages-switcher{position:fixed;z-index:2147483647;top:8px;right:10px;display:flex;gap:6px;padding:2px 4px;background:rgba(20,15,12,.38);backdrop-filter:blur(4px);border-radius:3px}#alc-pages-switcher a{width:23px;height:23px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none!important;font:600 12px/1 Arial,sans-serif!important;color:rgba(245,226,196,.72)!important;border-bottom:2px solid transparent!important}#alc-pages-switcher a:hover,#alc-pages-switcher a:focus,#alc-pages-switcher a.active{color:#fff!important;outline:none}#alc-pages-switcher a.active{border-bottom-color:#e59758!important}</style>`;const nav=`<nav id="alc-pages-switcher" aria-label="Display mode"><a href="../light/" title="Light">☀</a><a class="active" href="./" title="Dark" aria-current="true">☾</a><a href="../dark-ages/" title="Dark Ages">✥</a><a href="../terminal/" title="Terminal">&gt;_</a></nav>`;html=html.replace('</head>',css+'</head>').replace(/<body([^>]*)>/i,'<body$1>'+nav);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="padding:2rem;white-space:pre-wrap">Could not load preview: '+String(e)+'</pre>'}})();</script></body></html>'''
          Path('site/dark/index.html').write_text(dark)

          terminal=dark.replace("['chunk-00','chunk-01','chunk-02','chunk-03']","['chunk-00','chunk-01']").replace('rgba(20,15,12,.38)','rgba(0,0,0,.5)').replace('rgba(245,226,196,.72)','#7ee097').replace('#e59758','#7ee097').replace('<a class="active" href="./" title="Dark" aria-current="true">☾</a>','<a href="../dark/" title="Dark">☾</a>').replace('<a href="../terminal/" title="Terminal">&gt;_</a>','<a class="active" href="./" title="Terminal" aria-current="true">&gt;_</a>')
          Path('site/terminal/index.html').write_text(terminal)

          # Remove this one-shot workflow from the follow-up commit.
          Path('.github/workflows/one-shot-theme-lab.yml').unlink()
          PY
          git config user.name "mattsimoto"
          git config user.email "m.s.russell@gmail.com"
          git add -A
          git commit -m "Normalize GitHub Pages themes and Dark Ages v4"
          git push
